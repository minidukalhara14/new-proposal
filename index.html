<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-card {
            background: white;
            padding: 40px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 85%;
            border: 1px solid #eaeaea;
        }
        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #e63946;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 20px;
            color: #4a5568;
            margin-top: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .divider {
            height: 2px;
            background: #edf2f7;
            margin: 20px 0;
        }
        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #2d3748;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <h1 class="error-code">404</h1>
        <div class="error-title">Page Not Found</div>
        <div class="divider"></div>
        <p class="message">
            කණගාටුයි, මෙම පිටුව සොයාගත නොහැක.<br><br>
            යම් දෙයක් දැනගැනීමට අවශ්‍ය නම්, මෙම ලින්ක් එක එවූ කෙනාව <b>WhatsApp</b> හරහා සම්බන්ධ කරගන්න.
        </p>
    </div>

</body>
</html>
