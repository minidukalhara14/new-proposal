<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise Quiz For You ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #feada6, #f5efef);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            position: relative;
            padding: 20px 10px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .heart-particle {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 77, 109, 0.4);
            user-select: none;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(220, 53, 69, 0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(220, 53, 69, 0.25);
        }

        .heart-icon {
            font-size: 45px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        h2 {
            color: #d63384;
            font-size: 1.35rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        button {
            padding: 14px 22px;
            font-size: 1rem;
            font-family: inherit;
            border: 2px solid #ff4d6d;
            background-color: #ffffff;
            color: #ff4d6d;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease-in-out;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.1);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover, button:active {
            background-color: #ff4d6d;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(255, 77, 109, 0.3);
        }

        #finalBtns {
            position: relative;
            min-height: 120px;
            display: none;
            margin-top: 20px;
        }

        #yesBtn {
            background-color: #2a9d8f;
            border-color: #2a9d8f;
            color: white;
            font-size: 1.1rem;
            padding: 14px 32px;
            box-shadow: 0 6px 15px rgba(42, 157, 143, 0.3);
        }

        #yesBtn:hover {
            background-color: #218377;
            border-color: #218377;
            transform: scale(1.05);
        }

        #noBtn {
            position: absolute;
            background-color: #e63946;
            border-color: #e63946;
            color: white;
            font-size: 1.05rem;
            padding: 12px 28px;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.25);
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
        }

        .success-message {
            display: none;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-main {
            font-size: 1.5rem;
            color: #d63384;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .success-sub {
            font-size: 1rem;
            color: #4a5568;
            line-height: 1.7;
            background: #fff5f6;
            padding: 18px;
            border-radius: 16px;
            border: 1px dashed #ffb3c1;
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ffe6e8;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 25%;
            background: #ff4d6d;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="heartContainer"></div>

    <div class="card">
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="heart-icon">💖</div>

        <h2 id="questionText">Loading...</h2>
        
        <div id="optionsContainer" class="options"></div>

        <div id="finalBtns">
            <button id="yesBtn" onclick="finishProposal()">Yes! ❤️</button>
            <button id="noBtn">No 😜</button>
        </div>

        <div id="successMessage" class="success-message">
            <div class="success-main">Yay! I knew it! I Love You So Much! 💖🥰🎉</div>
            <div class="success-sub">
                If you accept my proposal, please send me a reply message! 💕<br><br>
                If not, please don't be upset with me, I hope we can always remain best friends! 🥹❤️
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "1. ඔයා ආසම පාට මොකක්ද?",
                options: ["Pink / Red 💕", "Blue / Black 💙", "Pastel Shades ✨", "තවම තෝරලා නෑ 🙈"]
            },
            {
                question: "2. ඔයා වඩාත්ම ආස විවේකී වෙලාවට මොනවා කරන්නද?",
                options: ["Music අහන්න 🎧", "Movies / Series බලන්න 🍿", "ඇවිදින්න යන්න 🌿", "මාත් එක්ක කතා කරන්න 😜"]
            },
            {
                question: "3. අපේ යාළුකම ගැන ඔයාට හිතෙන්නෙ මොකක්ද?",
                options: ["ගොඩක් විශේෂයි ✨", "හරිම සුන්දරයි ❤️", "වචනයෙන් කියන්න බෑ 🥺"]
            },
            {
                question: "4. හැමදාම මේ වගේ මාත් එක්ක ඉන්න කැමතිද?",
                options: ["අනිවාර්යයෙන්ම! 🥰", "ඕනෑම වෙලාවක 💖"]
            }
        ];

        let currentQuestion = 0;

        function createHeartParticles() {
            const container = document.getElementById('heartContainer');
            const hearts = ['❤️', '💖', '💕', '💗', '✨'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(heart);
            }
        }

        function loadQuestion() {
            const current = quizData[currentQuestion];
            document.getElementById("questionText").innerText = current.question;
            
            // Update progress bar width
            const progressPercent = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById("progressFill").style.width = progressPercent + "%";

            const container = document.getElementById("optionsContainer");
            container.innerHTML = "";

            current.options.forEach(option => {
                const btn = document.createElement("button");
                btn.innerText = option;
                btn.onclick = nextQuestion;
                container.appendChild(btn);
            });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showProposal();
            }
        }

        function showProposal() {
            document.getElementById("progressBar").style.display = "none";
            document.getElementById("questionText").innerText = "ඔයාගේ ජීවිතේ ඉස්සරහට හැමදාම මාත් එක්ක බෙදාගන්න කැමතිද? Will you be mine forever? ❤️✨";
            document.getElementById("optionsContainer").style.display = "none";
            document.getElementById("finalBtns").style.display = "block";
            
            // Attach mobile + desktop escape triggers to NO button
            const noBtn = document.getElementById("noBtn");
            noBtn.addEventListener("mouseover", moveButton);
            noBtn.addEventListener("touchstart", function(e) {
                e.preventDefault();
                moveButton();
            });
            noBtn.addEventListener("click", moveButton);
        }

        function moveButton() {
            const noBtn = document.getElementById("noBtn");
            const card = document.querySelector(".card");
            
            // Calculate boundaries relative to viewport
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = "fixed";
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
            noBtn.style.transform = "none";
        }

        function finishProposal() {
            document.getElementById("questionText").style.display = "none";
            document.getElementById("finalBtns").style.display = "none";
            document.querySelector(".heart-icon").innerText = "💖🎉✨";
            document.getElementById("successMessage").style.display = "block";
        }

        // Initialize quiz load
        window.onload = function() {
            createHeartParticles();
            loadQuestion();
        };
    </script>
</body>
</html>
